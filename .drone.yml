kind: pipeline
name: default

workspace:
  path: /paperplane.cc

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
  - name: pnpm-cache
    host:
      path: /root/container-cache/.pnpm-cache
  - name: build-cache
    host:
      path: /root/container-cache/.build-cache
  - name: envfile
    host:
      path: /root/project-config/paperplane.cc/.env.production.local

trigger:
  branch:
    - main

steps:
  - name: restore-pnpm-cache
    image: drillster/drone-volume-cache
    pull: if-not-exists
    settings:
      restore: true
      mount:
        - /paperplane.cc/.pnpm-store
    volumes:
      - name: pnpm-cache
        path: /cache

  - name: install
    image: chiskat/baseline-node24-alpine:2026.6.8
    commands:
      - pnpm i --frozen-lockfile --store-dir /paperplane.cc/.pnpm-store
    environment:
      DO_NOT_TRACK: 1
      HUSKY: 0

  - name: rebuild-pnpm-cache
    image: drillster/drone-volume-cache
    pull: if-not-exists
    settings:
      rebuild: true
      mount:
        - /paperplane.cc/src/.pnpm-store
    volumes:
      - name: pnpm-cache
        path: /cache

  - name: check
    image: chiskat/baseline-node24-alpine:2026.6.8
    commands:
      - pnpm lint
      - pnpm format:prod
      - pnpm typegen
      - pnpm check-types

  - name: copy-env
    image: chiskat/baseline-node24-alpine:2026.6.8
    commands:
      - cp /temp/.env.production.local /paperplane.cc/
    volumes:
      - name: envfile
        path: /temp/.env.production.local

  - name: restore-build-cache
    image: drillster/drone-volume-cache
    pull: if-not-exists
    settings:
      restore: true
      mount:
        - /paperplane.cc/.next/cache
    volumes:
      - name: build-cache
        path: /cache

  - name: build
    image: chiskat/baseline-node24-alpine:2026.6.8
    commands:
      - pnpm build:prod

  - name: rebuild-build-cache
    image: drillster/drone-volume-cache
    pull: if-not-exists
    settings:
      rebuild: true
      mount:
        - /paperplane.cc/.next/cache
    volumes:
      - name: build-cache
        path: /cache

  - name: prisma-sync
    image: chiskat/baseline-node24-alpine:2026.6.8
    commands:
      - pnpm db:deploy

  - name: build-image
    image: docker:dind
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker build --progress plain --compress -t chiskat/paperplane.cc:${DRONE_COMMIT_SHA:0:8} .

  - name: stop-old-container
    image: docker:dind
    failure: ignore
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker stop paperplane-cc
      - docker rm paperplane-cc

  - name: handle-old-image
    image: docker:dind
    failure: ignore
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker tag chiskat/paperplane.cc:production chiskat/paperplane.cc:previous-prod
      - docker rmi chiskat/paperplane.cc:production

  - name: deploy
    image: appleboy/drone-ssh
    pull: if-not-exists
    settings:
      host:
        from_secret: DEPLOY_SSH_HOST
      username:
        from_secret: DEPLOY_SSH_USER
      key:
        from_secret: DEPLOY_SSH_PRIKEY
      command_timeout: 20m
      script:
        - docker tag chiskat/paperplane.cc:${DRONE_COMMIT_SHA:0:8} chiskat/paperplane.cc:production
        - cd /root/project-config/paperplane.cc
        - docker compose up -d

  - name: deploy-sync-s3
    image: amazon/aws-cli
    pull: if-not-exists
    environment:
      AWS_DEFAULT_REGION:
        from_secret: S3_REGION
      AWS_ACCESS_KEY_ID:
        from_secret: S3_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: S3_SECRET_ACCESS_KEY
      S3_BUCKET_NAME:
        from_secret: S3_BUCKET_NAME
      S3_ENDPOINT:
        from_secret: S3_ENDPOINT
    commands:
      - aws s3 sync /paperplane.cc/.next/static s3://$S3_BUCKET_NAME/paperplane.cc/_next/static --endpoint-url "$S3_ENDPOINT"

  - name: clean
    image: docker:dind
    failure: ignore
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker rmi chiskat/paperplane.cc:previous-prod
      - docker rmi chiskat/paperplane.cc:${DRONE_COMMIT_SHA:0:8}

  - name: rollback-handle-docker
    image: docker:dind
    when:
      status:
        - failure
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker stop paperplane.cc || true
      - docker rm paperplane.cc || true
      - docker rmi chiskat/paperplane.cc:production || true
      - docker rmi chiskat/paperplane.cc:${DRONE_COMMIT_SHA:0:8} || true

  - name: rollback-handle-ssh
    image: appleboy/drone-ssh
    pull: if-not-exists
    when:
      status:
        - failure
    settings:
      host:
        from_secret: DEPLOY_SSH_HOST
      username:
        from_secret: DEPLOY_SSH_USER
      key:
        from_secret: DEPLOY_SSH_PRIKEY
      command_timeout: 20m
      script:
        - docker tag chiskat/paperplane.cc:previous-prod chiskat/paperplane.cc:production || true
        - docker rmi chiskat/paperplane.cc:previous-prod || true
        - cd /root/project-config/paperplane.cc
        - docker compose up -d
