info:
  name: OA 机器人按 ID 发送（文本）
  type: http
  seq: 1

http:
  method: POST
  url: "{{API-HOST}}/oa-robot/:robotId/send"
  params:
    - name: robotId
      value: ""
      type: path
  body:
    type: json
    data: "{\r

      \  \"message\": \"TEXT\",\r

      \  \"text\": \"测试\",\r

      \  \"atAll\": \"\",\r

      \  \"atList\": []\r

      }"
  auth:
    type: apikey
    key: X-API-KEY
    value: "{{X-API-KEY}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
