info:
  name: OA 机器人按 ID 发送（图片）
  type: http
  seq: 3

http:
  method: POST
  url: "{{API-HOST}}/oa-robot/:robotId/send"
  params:
    - name: robotId
      value: ""
      type: path
  body:
    type: json
    data: "{\r

      \  \"message\": \"IMAGE\",\r

      \  \"imageURL\": \"https://cdn-dev.p01.cc/usercontent/oarobot/6dBoS8xXOC.png\",\r

      \  \"title\": \"测试\"\r

      }"
  auth:
    type: apikey
    key: X-API-KEY
    value: "{{X-API-KEY}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
